name: CI

on:
  push:
  pull_request:

env:
  RUST_VERSION: 1.99.0
  FEATURES: sources-journald,sources-docker_logs,sources-nats,sources-http_server,transforms-filter,transforms-remap,sinks-nats,sinks-loki,sinks-http,sinks-clickhouse

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The job containers on these runners are privileged, so never run them
    # for code from a fork.
    if: forgejo.event_name != 'pull_request' || forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    # Build on an older distro so that the binary runs on Debian 13.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout
        uses: https://code.m4ss.net/Actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: https://code.m4ss.net/Actions/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Cache
        uses: https://code.m4ss.net/Actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ env.RUST_VERSION }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ env.RUST_VERSION }}-${{ runner.arch }}-

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross protobuf-compiler

      - name: cargo build
        run: |
          cargo build --locked --release --no-default-features --features "$FEATURES" --target x86_64-unknown-linux-gnu
          cargo build --locked --release --no-default-features --features "$FEATURES" --target aarch64-unknown-linux-gnu

      - name: Upload artifacts
        uses: https://code.m4ss.net/Actions/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: vector
          if-no-files-found: error
          path: |
            target/x86_64-unknown-linux-gnu/release/vector
            target/aarch64-unknown-linux-gnu/release/vector
